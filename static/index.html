<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕本地化质检</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:1080px;margin:32px auto;padding:0 18px}input,select,textarea,button{padding:7px;margin:3px}.card{border:1px solid #d9e1e8;border-radius:10px;padding:16px;margin:16px 0}pre,textarea{background:#f5f7f9;padding:12px;overflow:auto;width:100%;box-sizing:border-box}button{cursor:pointer}small{color:#667}</style></head>
<body><h1>影视字幕本地化质检</h1><p>示例项目已含术语表。分配翻译、时间轴和复核人员后，录入带时间点的字幕与评论，再完成提交、复核、锁定和交付。</p>
<div class="card"><h2>身份与版本</h2><input id="user" value="alice"><select id="role"><option>owner</option><option>reviewer</option><option>translator</option><option>admin</option></select><label>版本 ID <input id="version" type="number" value="1"></label><button onclick="refresh()">刷新</button><pre id="data">等待刷新…</pre></div>
<div class="card"><h2>录入字幕</h2><textarea id="cue" rows="5">{"cue_index":1,"start_ms":1000,"end_ms":3000,"text":"海豹出现在冰面上","expected_revision":0}</textarea><button onclick="saveCue()">保存字幕</button><pre id="cueResult"></pre></div>
<div class="card"><h2>时间点评论</h2><input id="time" type="number" value="1200"><input id="comment" value="请复核这里的术语"><button onclick="addComment()">添加评论</button><pre id="commentResult"></pre></div>
<div class="card"><h2>状态流转</h2><button onclick="action('submit')">提交复核</button><button onclick="review('approve')">复核通过</button><button onclick="review('reject')">退回修改</button><button onclick="action('lock')">锁定</button><button onclick="action('deliver')">交付</button><pre id="stateResult"></pre></div>
<div class="card"><h2>平台交付规格</h2><p><small>按平台帧率换算当前版本时间轴并留存快照；原版本后续修改不影响已生成规格。换算后重叠、越界或空时长会标出句号并阻止该规格交付。</small></p>
<input id="platform" value="极光TV"><select id="targetFps"><option selected>23.976</option><option>24</option><option>25</option><option>29.97</option><option>30</option></select><input id="specDuration" type="number" placeholder="平台片长ms(可空)" style="width:150px"><button onclick="createSpec()">生成规格</button><button onclick="loadSpecs()">查询规格</button><pre id="specResult"></pre><div id="specDetail"></div></div>
<script>
const auth=()=>({'Content-Type':'application/json','X-User':user.value,'X-Role':role.value});
async function call(url,opts={}){const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
async function saveCue(){try{cueResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/cues',{method:'POST',headers:auth(),body:cue.value}),null,2)}catch(e){cueResult.textContent=e.message}}
async function addComment(){try{commentResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/comments',{method:'POST',headers:auth(),body:JSON.stringify({time_ms:+time.value,body:comment.value})}),null,2)}catch(e){commentResult.textContent=e.message}}
async function action(name){try{stateResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/'+name,{method:'POST',headers:auth(),body:'{}'}),null,2);refresh()}catch(e){stateResult.textContent=e.message}}
async function review(decision){try{stateResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/review',{method:'POST',headers:auth(),body:JSON.stringify({decision,comment:''})}),null,2);refresh()}catch(e){stateResult.textContent=e.message}}
async function refresh(){try{const [p,v,c,cm,d]=await Promise.all(['/api/projects','/api/versions','/api/versions/'+version.value+'/cues','/api/versions/'+version.value+'/comments','/api/deliveries'].map(call));data.textContent=JSON.stringify({p,v,c,cm,d},null,2);loadSpecs()}catch(e){data.textContent=e.message}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tc=ms=>{const p=(n,l=2)=>String(n).padStart(l,'0');return p(Math.floor(ms/3600000))+':'+p(Math.floor(ms%3600000/60000))+':'+p(Math.floor(ms%60000/1000))+','+p(ms%1000,3)};
async function createSpec(){try{const body={platform:platform.value,target_fps:parseFloat(targetFps.value)};if(specDuration.value)body.media_duration_ms=+specDuration.value;specResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/specs',{method:'POST',headers:auth(),body:JSON.stringify(body)}),null,2);loadSpecs()}catch(e){specResult.textContent=e.message}}
async function loadSpecs(){try{const j=await call('/api/versions/'+version.value+'/specs');specDetail.innerHTML=j.specs.map(s=>`<div>#${s.id} ${esc(s.platform)} 第${s.spec_no}版 ${s.source_fps}→${s.target_fps}fps [${s.status}] 问题${s.issues.length}条 <button onclick="viewSpec(${s.id})">查看</button></div>`).join('')||'暂无规格'}catch(e){specDetail.textContent=e.message}}
async function viewSpec(id){try{const s=await call('/api/specs/'+id);const bad=new Set(s.issues.map(i=>i.cue_index));let h=`<h3>规格 #${s.id} ${esc(s.platform)}（${s.source_fps}→${s.target_fps}fps，状态 ${s.status}，源修订 ${s.source_revision}）</h3>`;if(s.issues.length)h+='<p style="color:#c00">'+s.issues.map(i=>esc(i.message)).join('<br>')+'</p>';h+='<table border="1" cellpadding="6" cellspacing="0"><tr><th>句号</th><th>原时码</th><th>新时码</th><th>文字</th></tr>';for(const r of s.rows)h+=`<tr${bad.has(r.cue_index)?' style="background:#fdecea"':''}><td>${r.cue_index}</td><td>${tc(r.orig_start_ms)} → ${tc(r.orig_end_ms)}</td><td>${tc(r.new_start_ms)} → ${tc(r.new_end_ms)}</td><td>${esc(r.text)}</td></tr>`;h+='</table>';if(s.status==='ready')h+=`<button onclick="deliverSpec(${s.id})">交付该规格</button>`;if(s.status==='blocked')h+='<p style="color:#c00">存在阻断问题，禁止交付</p>';specDetail.innerHTML=h}catch(e){specDetail.textContent=e.message}}
async function deliverSpec(id){try{specResult.textContent=JSON.stringify(await call('/api/specs/'+id+'/deliver',{method:'POST',headers:auth(),body:'{}'}),null,2);viewSpec(id)}catch(e){specResult.textContent=e.message;viewSpec(id)}}
</script></body></html>
